<div class="intelligent-flow">
  @if (currentStep() === 'upload') {
    <app-upload-step (extractionComplete)="onExtractionComplete($event)" />
  } @else {
    @if (extractionResult(); as result) {
      <app-review-step
        [extractionResult]="result"
        (backToUpload)="onBackToUpload()" />
    }
  }
</div>
