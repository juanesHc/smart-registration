@if (result(); as r) {
  @if (r.level !== 'none') {
    <div class="strength-container">
      <div class="strength-bar">
        <div
          class="strength-fill"
          [class.weak]="r.level === 'weak'"
          [class.medium]="r.level === 'medium'"
          [class.strong]="r.level === 'strong'"
          [style.width.%]="r.score">
        </div>
      </div>
      <span
        class="strength-label"
        [class.weak]="r.level === 'weak'"
        [class.medium]="r.level === 'medium'"
        [class.strong]="r.level === 'strong'">
        {{ 'ui.' + r.labelKey | translate }}
      </span>
    </div>
  }
}
